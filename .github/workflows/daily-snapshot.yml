name: Daily Trending Snapshot

on:
  schedule:
    # 02:07 UTC = 09:07 WIB. Weekly reports are written automatically on the first run of each week.
    - cron: "7 2 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: daily-snapshot
  cancel-in-progress: false

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Record trending repos and analyze
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python tracker.py

      - name: Commit and push if changed
        run: |
          git config user.name "arielshakaramiro"
          git config user.email "shakaramiroariel@gmail.com"
          git add -A
          if git diff --staged --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git commit -m "trending: snapshot $(TZ=Asia/Jakarta date +%F)"
          git push
